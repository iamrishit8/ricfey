<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ricfey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Inter:wght@400;500;600&family=Bagel+Fat+One&family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400..800&family=Unbounded:wght@600..900&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400..700&family=Outfit:wght@300..800&family=Gochi+Hand&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so there is no light flash in dark mode.
      try {
        // ?theme=dark|light overrides the saved choice (handy for screenshots and tests).
        const forced = new URLSearchParams(location.search).get('theme');
        if (forced ? forced === 'dark' : localStorage.getItem('ricfey-theme') === 'dark')
          document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
